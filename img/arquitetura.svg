<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="920" height="360" fill="#0F172A"/>

  <!-- Interface -->
  <rect x="40" y="120" width="220" height="120" rx="10" fill="#2B394E" stroke="#7C3AED" stroke-width="2"/>
  <text x="150" y="170" fill="#F8FAFC" font-size="18" font-weight="bold" text-anchor="middle">Interface</text>
  <text x="150" y="195" fill="#94A3B8" font-size="13" text-anchor="middle">(Front-End)</text>
  <text x="150" y="215" fill="#94A3B8" font-size="12" text-anchor="middle">HTML / CSS / JS · Nginx</text>

  <!-- API back-end -->
  <rect x="350" y="120" width="220" height="120" rx="10" fill="#2B394E" stroke="#7C3AED" stroke-width="2"/>
  <text x="460" y="160" fill="#F8FAFC" font-size="18" font-weight="bold" text-anchor="middle">API</text>
  <text x="460" y="182" fill="#94A3B8" font-size="13" text-anchor="middle">(Back-End)</text>
  <text x="460" y="202" fill="#94A3B8" font-size="12" text-anchor="middle">Flask · flask-openapi3</text>
  <text x="460" y="220" fill="#94A3B8" font-size="12" text-anchor="middle">SQLite (SQLAlchemy)</text>

  <!-- API externa -->
  <rect x="660" y="120" width="220" height="120" rx="10" fill="#1e2c4a" stroke="#38bdf8" stroke-width="2"/>
  <text x="770" y="170" fill="#F8FAFC" font-size="18" font-weight="bold" text-anchor="middle">API Externa</text>
  <text x="770" y="195" fill="#94A3B8" font-size="13" text-anchor="middle">RAWG Video Games</text>
  <text x="770" y="215" fill="#94A3B8" font-size="12" text-anchor="middle">Database</text>

  <!-- Arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <line x1="260" y1="160" x2="345" y2="160" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="345" y1="200" x2="260" y2="200" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="302" y="150" fill="#a78bfa" font-size="11" text-anchor="middle">REST</text>

  <line x1="570" y1="160" x2="655" y2="160" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="655" y1="200" x2="570" y2="200" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="612" y="150" fill="#38bdf8" font-size="11" text-anchor="middle">REST</text>

  <text x="150" y="280" fill="#64748B" font-size="12" text-anchor="middle">GET/POST/PUT/DELETE</text>
  <text x="460" y="280" fill="#64748B" font-size="12" text-anchor="middle">GET /jogo/buscar-externo</text>
  <text x="770" y="280" fill="#64748B" font-size="12" text-anchor="middle">https://api.rawg.io/api</text>

  <text x="460" y="40" fill="#F8FAFC" font-size="20" font-weight="bold" text-anchor="middle">GameLog — Arquitetura (Cenário 1.1)</text>
</svg>
